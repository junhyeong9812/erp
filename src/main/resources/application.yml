spring:
  application:
    name: erp

  datasource:
    url: jdbc:h2:mem:erpdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  # 실제 영속화는 InMemoryRepository(Map) 이 담당.
  # JPA 는 어노테이션만 유지하고 스키마를 만들지 않는다.
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  threads:
    virtual:
      enabled: true

  # Spring Batch (PHASE03B 에서 사용)
  #  - initialize-schema: always → BATCH_* 메타테이블을 H2 에 자동 생성 (매 부팅마다 create-or-continue)
  #  - job.enabled: false → 앱 기동 시 모든 Job 을 자동 실행하지 않음. JobLauncher 로 수동/스케줄러 트리거.
  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false

server:
  port: 8080

logging:
  level:
    com.erp: DEBUG