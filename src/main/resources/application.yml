spring:
  application:
    name: erp
    
  datasource:
    url: jdbc:h2:mem:erpdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
    
  h2:
    console:
      enabled: true
      path: /h2-console
      
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        
server:
  port: 8080
  
logging:
  level:
    com.erp: DEBUG
    org.hibernate.SQL: DEBUG
